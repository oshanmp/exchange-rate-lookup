<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sampath Bank Exchange Rates</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e14;
            --bg-secondary: #111822;
            --bg-card: #1a2332;
            --accent-green: #00ff88;
            --accent-cyan: #00d4ff;
            --accent-purple: #b266ff;
            --text-primary: #e8eaed;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --border: rgba(255, 255, 255, 0.08);
            --shadow: rgba(0, 0, 0, 0.4);
            --gradient-1: linear-gradient(135deg, #00ff88 0%, #00d4ff 100%);
            --gradient-2: linear-gradient(135deg, #b266ff 0%, #00d4ff 100%);
        }

        body {
            font-family: 'IBM Plex Mono', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(0, 255, 136, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(178, 102, 255, 0.03) 0%, transparent 50%);
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header {
            margin-bottom: 3rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 2rem;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        h1 {
            font-family: 'Fraunces', serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 800;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
            line-height: 1.1;
            margin-bottom: 0.5rem;
        }

        .bank-name {
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 500;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--accent-green);
            background: rgba(0, 255, 136, 0.05);
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            border: 1px solid rgba(0, 255, 136, 0.2);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.9);
            }
        }

        .timestamp {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .watchlist {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .currency-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 2rem;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            animation: slideUp 0.6s ease-out backwards;
        }

        .currency-card:nth-child(1) { animation-delay: 0.1s; }
        .currency-card:nth-child(2) { animation-delay: 0.2s; }
        .currency-card:nth-child(3) { animation-delay: 0.3s; }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .currency-card:hover {
            border-color: var(--accent-cyan);
            box-shadow: 0 8px 32px rgba(0, 212, 255, 0.1);
            transform: translateY(-4px);
        }

        .currency-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gradient-1);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .currency-card:hover::before {
            opacity: 1;
        }

        .currency-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .currency-code {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .currency-name {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        .flag-icon {
            width: 40px;
            height: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 0.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .rate-display {
            margin-bottom: 1.5rem;
        }

        .rate-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
        }

        .rate-value {
            font-family: 'Fraunces', serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1;
        }

        .rate-suffix {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-left: 0.25rem;
        }

        .comparison {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .comparison-item {
            flex: 1;
        }

        .comparison-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        .comparison-value {
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .loading {
            color: var(--accent-purple);
            animation: blink 1.5s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .spread-indicator {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.25rem 0.5rem;
            background: rgba(178, 102, 255, 0.1);
            border-radius: 0.25rem;
            font-size: 0.75rem;
            color: var(--accent-purple);
        }

        .actions {
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.875rem 1.75rem;
            border: none;
            border-radius: 0.5rem;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: var(--gradient-1);
            color: var(--bg-primary);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 255, 136, 0.3);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--accent-cyan);
            background: rgba(0, 212, 255, 0.05);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 14, 20, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            padding: 2rem;
            overflow-y: auto;
            animation: fadeIn 0.3s ease-out;
        }

        .modal.active {
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 1rem;
            max-width: 1200px;
            width: 100%;
            margin: 2rem auto;
            animation: slideUp 0.4s ease-out;
        }

        .modal-header {
            padding: 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-family: 'Fraunces', serif;
            font-size: 1.8rem;
            font-weight: 700;
            background: var(--gradient-2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
            line-height: 1;
            transition: color 0.3s ease;
        }

        .close-btn:hover {
            color: var(--text-primary);
        }

        .modal-body {
            padding: 2rem;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 0.5rem;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: var(--bg-card);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            padding: 1rem;
            text-align: left;
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 600;
            border-bottom: 2px solid var(--border);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        tbody tr {
            transition: background 0.2s ease;
        }

        tbody tr:hover {
            background: rgba(0, 212, 255, 0.03);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .table-code {
            font-weight: 600;
            color: var(--accent-cyan);
        }

        .table-rate {
            font-family: 'Fraunces', serif;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .disclaimer {
            margin-top: 3rem;
            padding: 1.5rem;
            background: rgba(178, 102, 255, 0.05);
            border: 1px solid rgba(178, 102, 255, 0.2);
            border-radius: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.8;
        }

        .error {
            padding: 1.5rem;
            background: rgba(255, 82, 82, 0.1);
            border: 1px solid rgba(255, 82, 82, 0.3);
            border-radius: 0.5rem;
            color: #ff5252;
            margin-bottom: 2rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1.5rem 1rem;
            }

            h1 {
                font-size: 2rem;
            }

            .watchlist {
                grid-template-columns: 1fr;
            }

            .rate-value {
                font-size: 2rem;
            }

            .modal-content {
                margin: 1rem;
            }

            .table-wrapper {
                font-size: 0.85rem;
            }

            th, td {
                padding: 0.75rem 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <div>
                    <div class="bank-name">Sampath Bank</div>
                    <h1>Exchange Rates</h1>
                </div>
                <div class="live-indicator">
                    <span class="live-dot"></span>
                    <span>Live Rates</span>
                </div>
            </div>
            <div class="timestamp" id="timestamp">
                <span>⏱</span>
                <span id="rateTime">Loading...</span>
            </div>
        </header>

        <div id="error-container"></div>

        <section class="watchlist" id="watchlist">
            <!-- Currency cards will be inserted here -->
        </section>

        <div class="actions">
            <button class="btn btn-primary" onclick="refreshRates()">
                ↻ Refresh Rates
            </button>
            <button class="btn btn-secondary" onclick="toggleModal()">
                View All Currencies
            </button>
        </div>

        <div class="disclaimer" id="disclaimer">
            Loading disclaimer...
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">All Exchange Rates</h2>
                <button class="close-btn" onclick="toggleModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="table-wrapper">
                    <table id="allRatesTable">
                        <thead>
                            <tr>
                                <th>Currency</th>
                                <th>Code</th>
                                <th>TT Buy</th>
                                <th>TT Sell</th>
                                <th>OD Buy</th>
                                <th>Off-Market Rate</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- Rows will be inserted here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Currencies to watch
        const WATCH_CURRENCIES = ['AUD', 'USD'];

        // Currency flags (emoji)
        const FLAGS = {
            'USD': '🇺🇸',
            'AUD': '🇦🇺',
            'GBP': '🇬🇧',
            'EUR': '🇪🇺',
            'JPY': '🇯🇵',
            'NZD': '🇳🇿',
            'CHF': '🇨🇭',
            'SEK': '🇸🇪',
            'DKK': '🇩🇰',
            'CAD': '🇨🇦',
            'SGD': '🇸🇬',
            'HKD': '🇭🇰',
            'NOK': '🇳🇴',
            'CNY': '🇨🇳',
            'ZAR': '🇿🇦',
            'AED': '🇦🇪',
            'INR': '🇮🇳',
            'LKR': '🇱🇰'
        };

        // Data storage
        let exchangeRatesData = null;
        let currencyRatesData = null;
        let midMarketRates = {};

        // Fetch exchange rates from Sampath Bank API
        async function fetchExchangeRates() {
            try {
                const response = await fetch('https://www.sampath.lk/api/exchange-rates', {
                    method: 'GET',
                    headers: {
                        'accept': 'application/json, text/plain, */*',
                        'accept-language': 'en-US,en;q=0.9,si;q=0.8',
                        'referer': 'https://www.sampath.lk/rates-and-charges?activeTab=exchange-rates',
                        'sec-fetch-dest': 'empty',
                        'sec-fetch-mode': 'cors',
                        'sec-fetch-site': 'same-origin'
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Error fetching exchange rates:', error);
                throw error;
            }
        }

        // Fetch currency rates (for ByOVC) from Sampath Bank API
        async function fetchCurrencyRates() {
            try {
                const response = await fetch('https://www.sampath.lk/api/currency-rates', {
                    method: 'GET',
                    headers: {
                        'accept': 'application/json, text/plain, */*',
                        'accept-language': 'en-US,en;q=0.9,si;q=0.8',
                        'referer': 'https://www.sampath.lk/rates-and-charges?activeTab=exchange-rates',
                        'sec-fetch-dest': 'empty',
                        'sec-fetch-mode': 'cors',
                        'sec-fetch-site': 'same-origin'
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Error fetching currency rates:', error);
                throw error;
            }
        }

        // Initialize the page
        async function init() {
            try {
                // Show loading state
                document.getElementById('rateTime').textContent = 'Loading...';

                // Fetch both APIs concurrently
                const [exchangeData, currencyData] = await Promise.all([
                    fetchExchangeRates(),
                    fetchCurrencyRates()
                ]);

                exchangeRatesData = exchangeData;
                currencyRatesData = currencyData;

                if (!exchangeRatesData.success) {
                    showError('Failed to load exchange rates');
                    return;
                }

                // Display timestamp
                if (exchangeRatesData.data.length > 0) {
                    document.getElementById('rateTime').textContent = exchangeRatesData.data[0].RateWEF;
                }

                // Display disclaimer
                document.getElementById('disclaimer').innerHTML = exchangeRatesData.description;

                // Fetch mid-market rates
                fetchMidMarketRates();

                // Display watchlist currencies
                displayWatchlist();

                // Populate all rates table
                populateAllRatesTable();

            } catch (error) {
                showError('Failed to load exchange rates from Sampath Bank. Please check your internet connection and try again.');
                console.error('Initialization error:', error);
            }
        }

        // Fetch mid-market rates from an exchange rate API
        async function fetchMidMarketRates() {
            try {
                // Using exchangerate-api.com (free tier)
                const response = await fetch('https://api.exchangerate-api.com/v4/latest/LKR');
                const data = await response.json();
                
                // Convert rates (API gives rates FROM LKR, we need rates TO LKR)
                for (let currency in data.rates) {
                    midMarketRates[currency] = 1 / data.rates[currency];
                }

                // Update the display
                displayWatchlist();
            } catch (error) {
                console.error('Failed to fetch mid-market rates:', error);
                // Display cards anyway with loading state for mid-market rates
            }
        }

        // Display watchlist currencies
        function displayWatchlist() {
            const watchlist = document.getElementById('watchlist');
            watchlist.innerHTML = '';

            if (!exchangeRatesData || !exchangeRatesData.data) {
                return;
            }

            const watchCurrencies = exchangeRatesData.data.filter(curr => 
                WATCH_CURRENCIES.includes(curr.CurrCode)
            );

            watchCurrencies.forEach(currency => {
                const card = createCurrencyCard(currency);
                watchlist.appendChild(card);
            });
        }

        // Create currency card
        function createCurrencyCard(currency) {
            const card = document.createElement('div');
            card.className = 'currency-card';

            const ttBuyRate = parseFloat(currency.TTBUY);
            const ttSellRate = parseFloat(currency.TTSEL);
            const spread = ((ttSellRate - ttBuyRate) / ttBuyRate * 100).toFixed(2);

            const midMarket = midMarketRates[currency.CurrCode];
            const midMarketDisplay = midMarket 
                ? `LKR ${midMarket.toFixed(4)}`
                : '<span class="loading">Loading...</span>';

            const difference = midMarket 
                ? ((ttBuyRate - midMarket) / midMarket * 100).toFixed(2)
                : null;

            card.innerHTML = `
                <div class="currency-header">
                    <div>
                        <div class="currency-code">${currency.CurrCode}</div>
                        <div class="currency-name">${currency.CurrName}</div>
                    </div>
                    <div class="flag-icon">${FLAGS[currency.CurrCode] || '💱'}</div>
                </div>

                <div class="rate-display">
                    <div class="rate-label">Bank T/T Buy Rate</div>
                    <div class="rate-value">
                        ${formatRate(ttBuyRate)}
                        <span class="rate-suffix">LKR</span>
                    </div>
                </div>

                <div class="comparison">
                    <div class="comparison-item">
                        <div class="comparison-label">Mid-Market</div>
                        <div class="comparison-value">${midMarketDisplay}</div>
                    </div>
                    <div class="comparison-item">
                        <div class="comparison-label">Bank Spread</div>
                        <div class="comparison-value">
                            <span class="spread-indicator">+${spread}%</span>
                        </div>
                    </div>
                </div>
            `;

            return card;
        }

        // Format rate with appropriate decimals
        function formatRate(rate) {
            if (rate < 10) {
                return rate.toFixed(4);
            } else if (rate < 100) {
                return rate.toFixed(2);
            } else {
                return rate.toFixed(2);
            }
        }

        // Get ByOVC value for a currency
        function getByOVC(currCode) {
            if (!currencyRatesData || !currencyRatesData.data) {
                return null;
            }
            
            const currency = currencyRatesData.data.find(c => c.CurrCode === currCode);
            return currency ? currency.ByOVC : null;
        }

        // Populate all rates table
        function populateAllRatesTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (!exchangeRatesData || !exchangeRatesData.data) {
                return;
            }

            exchangeRatesData.data.forEach(currency => {
                const byOVC = getByOVC(currency.CurrCode);
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${FLAGS[currency.CurrCode] || '💱'} ${currency.CurrName}</td>
                    <td class="table-code">${currency.CurrCode}</td>
                    <td class="table-rate">${formatRate(parseFloat(currency.TTBUY))}</td>
                    <td>${formatRate(parseFloat(currency.TTSEL))}</td>
                    <td>${formatRate(parseFloat(currency.ODBUY))}</td>
                    <td>${byOVC ? formatRate(parseFloat(byOVC)) : '-'}</td>
                `;
                tbody.appendChild(row);
            });
        }

        // Toggle modal
        function toggleModal() {
            const modal = document.getElementById('modal');
            modal.classList.toggle('active');
        }

        // Close modal when clicking outside
        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) {
                toggleModal();
            }
        });

        // Refresh rates
        async function refreshRates() {
            try {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '⟳ Refreshing...';
                btn.disabled = true;

                // Fetch fresh data from both APIs
                const [exchangeData, currencyData] = await Promise.all([
                    fetchExchangeRates(),
                    fetchCurrencyRates(),
                    fetchMidMarketRates()
                ]);

                exchangeRatesData = exchangeData;
                currencyRatesData = currencyData;

                // Update timestamp
                if (exchangeRatesData.data.length > 0) {
                    document.getElementById('rateTime').textContent = exchangeRatesData.data[0].RateWEF;
                }

                // Update displays
                displayWatchlist();
                populateAllRatesTable();

                // Show success state
                btn.textContent = '✓ Updated';
                btn.style.background = 'var(--gradient-2)';

                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.style.background = '';
                    btn.disabled = false;
                }, 2000);

            } catch (error) {
                const btn = event.target;
                btn.textContent = '✗ Failed';
                btn.style.background = 'rgba(255, 82, 82, 0.3)';
                
                setTimeout(() => {
                    btn.textContent = '↻ Refresh Rates';
                    btn.style.background = '';
                    btn.disabled = false;
                }, 2000);

                console.error('Refresh error:', error);
            }
        }

        // Show error
        function showError(message) {
            const errorContainer = document.getElementById('error-container');
            errorContainer.innerHTML = `
                <div class="error">
                    <strong>Error:</strong> ${message}
                </div>
            `;
        }

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
